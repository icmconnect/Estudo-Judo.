<!-- Open Graph & Social Media -->
    <!-- Schema.org Structured Data (JSON-LD) para Google Search & IAs de Busca -->

    {
      "@context": "https://schema.org",
      "@type": "EducationalApplication",
      "name": "Dojo Digital",
      "operatingSystem": "All",
      "applicationCategory": "EducationalApplication",

        "@type": "Organization",
        "name": "Dojo Digital Educational Team"
      }
    }
    </script>

    <!-- Script para prevenir flicker de tema (FOUC) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('dojo_digital_theme_v1') || localStorage.getItem('theme');
          const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches) || (!stored && !window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body class="bg-zinc-100 dark:bg-[#07090E] text-zinc-900 dark:text-zinc-100 antialiased selection:bg-amber-500 selection:text-zinc-950">
